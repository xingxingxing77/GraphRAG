# ==================================================
# GraphRAG 本地开发环境编排 (v2.2 · J19 双服务)
# 版本基准以 spec 第九章 9.4 为准 (2026-08-22 本机镜像清点):
#   neo4j:latest 当前即 2026.06.0 community | ES 8.12.0 | PG 17 | qdrant latest
# 注意:
#   - Ollama 宿主机原生安装(非容器化), 服务经 host.docker.internal:11434 访问
#   - agent 面依赖 app/agent/graph.py 的 build_agent_graph 完整实现后方可启动
# ==================================================

services:
  # --- 业务面 (J19): 认证/会话/反馈/图谱代理/config/public/precheck/admin ---
  app:
    build: .
    container_name: graphrag-app
    ports:
      - "8000:8000"
    env_file: .env
    # C5：与 agent 服务同口径的容器网络覆盖——.env 是宿主机视角
    # （localhost），容器内 app 服务不覆盖则依赖存储全线指向自身
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      DATABASE_URI: postgresql://graphrag:graphrag@postgres:5432/graphrag
      POSTGRES_DSN: postgresql://graphrag:graphrag@postgres:5432/graphrag
      # langgraph-server 在另一容器（thread/session 代理指向它）
      LANGGRAPH_SERVER_URL: http://agent:8001
      # Ollama 为宿主机原生安装（不容器化），见底部说明
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下访问宿主 Ollama
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_started
    restart: unless-stopped

  # --- Agent 面 (J19): langgraph-server 托管全链路图, 前端 SDK 直连 :8001 ---
  agent:
    build: .
    container_name: graphrag-agent
    command: ["langgraph", "dev", "--no-browser", "--port", "8001", "--host", "0.0.0.0"]
    ports:
      - "8001:8001"
    env_file: .env
    # 同 app 服务：.env 宿主机视角地址在容器内不可达，按容器网络覆盖
    environment:
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      DATABASE_URI: postgresql://graphrag:graphrag@postgres:5432/graphrag
      POSTGRES_DSN: postgresql://graphrag:graphrag@postgres:5432/graphrag
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # langgraph dev 为 in-mem 变体（api_variant=local_dev）：thread/assistant 与
      # checkpoint 由 langgraph_runtime_inmem._persistence 落盘到 cwd 下的
      # .langgraph_api/*.pckl，而非 DATABASE_URI 指向的 Postgres（实测 graphrag 库零表）。
      # 不挂卷则容器重建即丢全部会话，与 J21「Postgres 为权威源」的设计意图不符。
      - langgraph_api:/srv/.langgraph_api
    restart: unless-stopped

  # --- LangGraph thread checkpoint (J21 会话状态权威源) ---
  postgres:
    image: postgres:17
    container_name: graphrag-postgres
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
      POSTGRES_DB: graphrag
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- 向量库 (named sparse vectors 需 >=1.10, 本机 latest 满足) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: graphrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 镜像内无 wget/curl，原 `wget -qO-` 探测恒为 unhealthy，会让依赖它的
      # app/agent（depends_on: service_healthy）永远等不到就绪 → 改用 bash /dev/tcp
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- 图谱权威源 (latest = 2026.06.0 community, 文档基准) ---
  neo4j:
    image: neo4j:latest
    container_name: graphrag-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  # --- 全文检索 (IK 分词器首次启动自动安装, 匹配 8.12.0) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: graphrag-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    command: >
      bash -c "bin/elasticsearch-plugin install --batch https://get.infini.cloud/elasticsearch/analysis-ik/8.12.0 || echo '[skip] IK already installed';
               exec bin/elasticsearch"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- 缓存与记忆 (AOF 开启, 工作记忆不丢失) ---
  redis:
    image: redis:7-alpine
    container_name: graphrag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Ollama (可选 Profile B): 宿主机原生安装, 不在此容器化 ---
  # 启动方式(宿主机): ollama serve && ollama pull qcwind/qwen2.5-7B-instruct-Q4_K_M
  # 模型名须与 config/models.yaml local-qwen7b.model 精确一致
  # 容器内访问地址: http://host.docker.internal:11434 (见 config/models.yaml local-qwen7b)

volumes:
  langgraph_api:
  pg_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  es_data:
  redis_data:
