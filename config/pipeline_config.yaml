# ==================================================
# GraphRAG 数据管道全局配置
# ==================================================

pipeline:
  # P1 采集层
  ingestion:
    mode: incremental           # full | incremental
    scan_interval: 3600         # 秒
    dedup_by: content_hash
    sources:
      - type: local_file
        path: ./menu/HowToCook
        extensions: [".md"]
        max_file_size: 10485760  # 10MB

  # P2 解析层
  parsing:
    preserve_structure: true
    supported_formats: [md, html, pdf, docx]

  # P3 清洗层
  cleaning:
    rules:
      - RemoveImageRefs
      - RemoveBoilerplate
      - NormalizeWhitespace
      - FixEncoding
      - NormalizePunctuation
    quality_gate:
      min_length: 20
      language: zh
      dedup_similarity_threshold: 0.9

  # P4 分块层
  chunking:
    strategy: hierarchical       # hierarchical | fixed | semantic | recursive
    first_level:
      type: markdown_header
      headers_to_split_on:
        - ["#", "h1"]
        - ["##", "h2"]
        - ["###", "h3"]
        - ["####", "h4"]
    second_level:
      type: recursive_character
      chunk_size: 500
      chunk_overlap: 80
      separators: ["\n\n", "\n", "。", "；", " ", ""]
    constraints:
      min_chunk_size: 50
      max_chunk_size: 1500
    context_preservation:
      prefix_injection: true
      parent_ref: true

  # P5 增强层
  enrichment:
    enabled: true
    methods:
      - keyword_extract          # 轻量：所有文档
      - entity_extraction        # NER
    high_value_methods:          # 重度：仅核心文档
      - summary_generate
      - hypothetical_questions
    high_value_filter:
      min_access_count: 10
      categories: [staple, meat_dish]

  # P6 索引层
  indexing:
    vector_store: qdrant
    graph_store: neo4j
    batch_size: 100
    update_mode: incremental     # full | incremental
    qdrant:
      # 实际集合名为 rag_{doc_type}（app/pipeline/indexing/vector_indexer.py
      # 按文档类型动态建集合），本节其余参数与 ensure_collection 对齐
      dense_vector_size: 1024
      distance: cosine
      m: 16
      ef_construct: 200
    neo4j:
      text_index_name: entity_fulltext
      indexed_labels: [Entity, Recipe]

# 检索配置（m10 死键清理：top_k/rerank/rerank_model/rerank_top_k/
# rerank_threshold/compression_strategy 曾无任何读取方——Agent 主链路
# 的召回数硬编码于 tool_router._STEP_TOP_K=10，精排未接线。恢复对应
# 能力时先在代码里接上读取，再回填本节）
retrieval:
  fusion: rrf                    # rrf | weighted（FusionEngine 读取）
  weights:
    dense: 0.4
    sparse: 0.2
    graph: 0.3
    global: 0.2
    fulltext: 0.2
    web: 0.1

# 查询理解层（架构 L2 v3.1）：chitchat 规则前置（J18 热更）
query_understanding:
  chitchat_rules:
    max_length: 12             # 超过此长度的查询不走规则短路
    greeting_words:            # 问候语表命中即 chitchat
      - "你好"
      - "您好"
      - "hello"
      - "hi"
      - "嗨"
      - "在吗"
      - "谢谢"
      - "再见"
    question_words:            # 含疑问词视为实义查询，不短路
      - "怎么做"
      - "如何"
      - "为什么"
      - "是什么"
      - "哪个"
      - "多少"
      - "做法"
      - "步骤"

# Agent 第 6 层 A/B/E 系列优化项（架构 8.2）
agent:
  parallel_fanout: deep_only   # A1: deep 档无依赖子步骤并行扇出
  reflect_skip_threshold: 0.7  # A2: Top-K 归一化检索分均分短路阈值（M2 起各路检索分已归一 [0,1]）
  evidence_enough_count: 5     # A2: 有效证据数下限
  evidence_prune:
    keep_score: 0.25           # B3: 轮间修剪保留分线
    max_content_chars: 600     # B3: content 截长上限
  tool_memo:
    enabled: true              # E3: run 内工具记忆化
  hitl:
    enabled: false             # E2: HITL 中断挂点（默认关闭）
